name: Build checks

on:
  push:
  pull_request:
    # <!-- custom: Ignore the long-lived reference compare from main to the mirrored base AdvCiv 1.14 branch.
    # Keep it open so GitHub tracks the diff, but do not run duplicate PR checks for it. (ChatGPT-5.5) -->
    branches-ignore:
      - "1.14"
  workflow_dispatch:

jobs:
  build-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # <!-- custom: The DLL intent check reviews every commit in a push/PR range; keep history available for that concrete release-safety guard. (ChatGPT-5.6-Sol) -->
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # <!-- custom: Keep blocking CI focused on inexpensive repository/runtime correctness rather than implementation-shape, prose-style or balance-policy audits. Optional deeper helpers remain available for local review. (ChatGPT-5.6-Sol) -->
      - name: Repository and shipped-file sanity
        shell: bash
        run: |
          set -euo pipefail
          python .github/workflows/build/temp_files.py
          python .github/workflows/build/repository_hygiene.py
          python .github/workflows/build/line_endings.py
          python .github/workflows/build/assets_dlls.py

      - name: DLL update intent
        run: python .github/workflows/build/dll_commit_message.py --event-name "$EVENT_NAME" --event-path "$GITHUB_EVENT_PATH"
        env:
          EVENT_NAME: ${{ github.event_name }}

      - name: File and text references
        shell: bash
        run: |
          set -euo pipefail
          python .github/workflows/build/art_button_paths.py
          python .github/workflows/build/markdown_images.py
          python .github/workflows/build/markdown_links.py
          python .github/workflows/build/long_comments.py
          python .github/workflows/build/sas_text_references.py
          python .github/workflows/build/define_tag_refs.py
          python .github/workflows/build/tech_audio.py
          python .github/workflows/build/leader_audio.py
          python .github/workflows/build/opening_music.py
          python .github/workflows/build/fonts.py

      - name: XML and configuration sanity
        shell: bash
        run: |
          set -euo pipefail
          python .github/workflows/build/global_defines_nonempty.py
          python .github/workflows/build/sas_define_usage.py
          python .github/workflows/build/version_metadata.py
          python .github/workflows/build/launch_guard.py
          python .github/workflows/build/define_int_bounds.py
          python .github/workflows/build/xml_comments.py
          python .github/workflows/build/xml_element_only_content.py
          python .github/workflows/build/art_define_structure.py
          python .github/workflows/build/xml_suspicious_angle_tags.py
          python .github/workflows/build/xml_suspicious_text_chars.py
          python .github/workflows/build/xml_civ4_text_characters.py
          python .github/workflows/build/xml_text_duplicate_tags.py
          python .github/workflows/build/xml_parent_duplicate_keys.py
          python .github/workflows/build/xml_child_duplicates.py

      - name: Diagnostic safety and disabled defaults
        shell: bash
        run: |
          set -euo pipefail
          python .github/workflows/build/diagnostic_log_safety.py
          python .github/workflows/build/bbai_log.py
          python .github/workflows/build/sas_game_record_log.py

      - name: Runtime/generated configuration consistency
        shell: bash
        run: |
          set -euo pipefail
          python .github/workflows/build/detail_manager.py
          python .github/workflows/build/aip.py
          python .github/workflows/build/aip_predump_values.py
          python .github/workflows/build/worldsizes.py
          python .github/workflows/build/mapscripts.py
