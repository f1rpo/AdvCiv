name: Build checks

on:
  push:
  pull_request:
    # <!-- custom: Ignore the long-lived reference compare from main to the mirrored base AdvCiv 1.14 branch.
    # Keep it open so GitHub tracks the diff, but do not run duplicate PR checks for it. (ChatGPT-5.5) -->
    branches-ignore:
      - "1.14"
  workflow_dispatch:

jobs:
  build-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: python .github/workflows/build/temp_files.py
      - run: python -m unittest discover -s .github/workflows/tests
      - run: python .github/workflows/build/repository_hygiene.py
      - run: python .github/workflows/build/generated_docs.py --base-ref "$BASE_REF" --event-name "$EVENT_NAME"
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
      - run: python .github/workflows/build/source_change_provenance.py --base-ref "$BASE_REF" --event-name "$EVENT_NAME"
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
      - run: python .github/workflows/build/markdown_prose_changes.py --base-ref "$BASE_REF" --event-name "$EVENT_NAME"
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
      - run: python LLM_Helpers/reflow_custom_comments.py --check
      - run: python .github/workflows/build/line_endings.py
      - run: python .github/workflows/build/assets_dlls.py
      - run: python .github/workflows/build/dll_commit_message.py --event-name "$EVENT_NAME" --event-path "$GITHUB_EVENT_PATH"
        env:
          EVENT_NAME: ${{ github.event_name }}
      - run: python .github/workflows/build/art_button_paths.py
      - run: python .github/workflows/build/markdown_images.py
      - run: python .github/workflows/build/markdown_links.py
      - run: python .github/workflows/build/long_comments.py
      - run: python .github/workflows/build/markdown_structure.py
      - run: python .github/workflows/build/global_defines_nonempty.py
      - run: python .github/workflows/build/version_metadata.py
      - run: python .github/workflows/build/launch_guard.py
      - run: python .github/workflows/build/define_int_bounds.py
      - run: python .github/workflows/build/turn_define_gamespeed.py
      - run: python .github/workflows/build/sas_define_usage.py
      - run: python .github/workflows/build/xml_comments.py
      - run: python .github/workflows/build/xml_element_only_content.py
      - run: python .github/workflows/build/art_define_structure.py
      - run: python .github/workflows/build/xml_suspicious_angle_tags.py
      - run: python .github/workflows/build/xml_suspicious_text_chars.py
      - run: python .github/workflows/build/xml_civ4_text_characters.py
      - run: python .github/workflows/build/xml_sas_text_english.py
      - run: python .github/workflows/build/xml_text_duplicate_tags.py
      - run: python .github/workflows/build/sas_text_references.py
      - run: python .github/workflows/build/xml_parent_duplicate_keys.py
      - run: python .github/workflows/build/xml_child_duplicates.py
      - run: python .github/workflows/build/xml_redundant_defaults.py
      - run: python .github/workflows/build/tech_columns.py
      - run: python .github/workflows/build/wonder_cost_columns.py
      - run: python .github/workflows/build/wonder_culture_gpp_columns.py
      - run: python .github/workflows/build/asset_tech_prereq_redundancy.py
      - run: python .github/workflows/build/asset_primary_tech.py
      - run: python .github/workflows/build/civ_specific_assets.py
      - run: python .github/workflows/build/civ_specific_not_weaker.py
      - run: python .github/workflows/build/define_tag_refs.py
      - run: python .github/workflows/build/raw_getinfotype.py
      - run: python .github/workflows/build/tech_audio.py
      - run: python .github/workflows/build/leader_audio.py
      - run: python .github/workflows/build/opening_music.py
      - run: python .github/workflows/build/diagnostic_log_safety.py
      - run: python .github/workflows/build/bbai_log.py
      - run: python .github/workflows/build/sas_game_record_log.py
      - run: python .github/workflows/build/sas_revision_history.py --default-branch-ref "origin/$DEFAULT_BRANCH"
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - run: python .github/workflows/build/fonts.py
      - run: python .github/workflows/build/detail_manager.py
      - run: python .github/workflows/build/aip.py
      - run: python .github/workflows/build/aip_predump_values.py
      - run: python .github/workflows/build/worldsizes.py
      - run: python .github/workflows/build/mapscripts.py
