name: Checks - Helper tests

on:
  push:
  pull_request:
    # <!-- custom: Ignore the long-lived reference compare from main to the mirrored base AdvCiv 1.14 branch.
    # Keep it open so GitHub tracks the diff, but do not run duplicate PR checks for it. (ChatGPT-5.5) -->
    branches-ignore:
      - "1.14"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # <!-- custom: Match test folders to build subjects; explicit top-level discovery prevents tests/xml from shadowing the standard-library xml package. (GPT-6.1-Sol) -->
      - name: Assets helper tests
        run: python -m unittest discover -s .github/workflows/tests/assets -t .github/workflows -v
      - name: Diagnostics helper tests
        run: python -m unittest discover -s .github/workflows/tests/diagnostics -t .github/workflows -v
      - name: Documentation helper tests
        run: python -m unittest discover -s .github/workflows/tests/documentation -t .github/workflows -v
      - name: Hygiene helper tests
        run: python -m unittest discover -s .github/workflows/tests/hygiene -t .github/workflows -v
      - name: Repository helper tests
        run: python -m unittest discover -s .github/workflows/tests/repository -t .github/workflows -v
      - name: Source helper tests
        run: python -m unittest discover -s .github/workflows/tests/source -t .github/workflows -v
      - name: XML helper tests
        run: python -m unittest discover -s .github/workflows/tests/xml -t .github/workflows -v
